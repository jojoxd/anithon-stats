version: 3

tasks:
  server:sqlc:generate:
    cmd: sqlc generate
    dir: internal/server/dbal

  server:sqlc:vet:
    cmd: sqlc vet
    dir: internal/server/dbal

  vet:
    ignore_error: true

    cmds:
      - cmd: go vet ./...
      - task: server:sqlc:vet

  build:
    cmd:
      go build -v
        -tags nox11
        -o out/anistats 
        -ldflags "-X anistats/internal/constants.AppDebug=false" 
        -ldflags "-X anistats/internal/constants.Version=${VERSION}" 
        cmd/anistats/main.go
